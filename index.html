<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой Путь">
<meta name="theme-color" content="#14283a">
<meta name="description" content="Мой Путь Воина — личный трекер целей: здоровье, знания, карьера и внешность.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="splash.webp">
<title>Мой Путь Воина</title>
<style>
:root{
  --ok-health:#ff5a5a;   --ok-health-dim:#3a1416;
  --ok-knowledge:#3fd0ff; --ok-knowledge-dim:#0f2733;
  --ok-career:#f2b95f;   --ok-career-dim:#2a2010;
  --ok-appearance:#3ddc97; --ok-appearance-dim:#0f2a22;
  --accent:#f2b95f; --accent-dim:#2a2010;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#14283a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{padding:0}
#app{position:fixed;inset:0;width:100%;height:auto;min-height:0;overflow:hidden;background:#14283a}
.screen{position:absolute;inset:0;width:100%;height:auto;min-height:0;overflow:hidden;display:none;flex-direction:column;background:#14283a;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen::before{content:"";position:absolute;inset:-24px;background-image:var(--art-bg);background-size:150%;background-position:50% 50%;filter:blur(20px) brightness(.55);transform:scale(1.06);z-index:0;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{
  0%{background-position:48% 52%;transform:scale(1.06)}
  100%{background-position:53% 47%;transform:scale(1.1)}
}
.screen.active{display:flex}
#menu.screen{padding-top:0}

/* Stage: sized in JS to the artwork's exact pixel aspect ratio (see
   fitStage()) so it never crops and hotspots (measured in % of the
   artwork) always land exactly on the drawn buttons/panels, on any
   screen size or orientation. */
.stageWrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;margin:auto;z-index:1;will-change:transform}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;-webkit-user-drag:none;user-select:none;z-index:1;transform-origin:50% 42%;animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{0%{transform:scale(1)}100%{transform:scale(1.045)}}

.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:5;padding:0}
#start{left:18%;right:18%;top:61%;height:7%;border-radius:40px}
#health{left:36%;right:3%;top:66%;height:23%}
#knowledge{left:36%;right:3%;top:48%;height:17%}
#career{left:36%;right:3%;top:33%;height:14%}
#appearance{left:36%;right:3%;top:19%;height:13%}

/* first-visit hint pulse so people notice the tap zones */
.hint{animation:hintpulse 1.7s ease-out 2, drift 0s}
.hint::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(255,220,150,.55);pointer-events:none}
@keyframes hintpulse{
  0%{box-shadow:inset 0 0 0 0 rgba(255,220,150,0)}
  15%{box-shadow:inset 0 0 30px 4px rgba(255,220,150,.28)}
  40%{box-shadow:inset 0 0 0 0 rgba(255,220,150,0)}
  100%{box-shadow:inset 0 0 0 0 rgba(255,220,150,0)}
}

/* ripple feedback shared by every tappable element */
.rippler{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,224,170,.45);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none;z-index:8}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* Wind: soft drifting motes (pollen/embers/mist) */
.wind{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.wind i{position:absolute;bottom:-6%;left:var(--left);width:var(--size);height:var(--size);border-radius:50%;background:radial-gradient(circle,rgba(255,244,220,1),rgba(255,220,160,.6) 55%,rgba(255,220,160,0) 75%);opacity:0;box-shadow:0 0 6px 1px rgba(255,225,170,.5);animation:rise var(--dur) linear var(--delay) infinite}
@keyframes rise{
  0%{transform:translate(0,0);opacity:0}
  8%{opacity:var(--op)}
  50%{transform:translate(var(--drift),-55vh)}
  92%{opacity:var(--op)}
  100%{transform:translate(calc(var(--drift) * -1),-112vh);opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .screen::before,.art,.hint,.wind i{animation:none!important;display:revert}
  .wind i{display:none}
}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
.flash.go{animation:flash .18s ease-out}
@keyframes flash{0%{opacity:.18}100%{opacity:0}}

/* HUD (menu screen only) */
#hud{flex:0 0 auto;position:relative;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.iconbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,220,150,.35);background:rgba(8,14,21,.72);backdrop-filter:blur(6px);color:#fff0d8;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.hudProgress{flex:1 1 auto;min-width:0;background:rgba(8,14,21,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,220,150,.22);border-radius:16px;padding:7px 12px}
.hudTop{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#f4e6c8;margin-bottom:5px}
.hudTop b{font-size:14px;color:#ffe3ad}
.hudBarTrack{height:6px;background:#26303a;border-radius:10px;overflow:hidden}
.hudBarTrack i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#f2b95f,#fff0bd);transition:width .6s cubic-bezier(.22,.9,.32,1.3)}
.hudProgress.bump{animation:bump .4s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}

#panel{position:absolute;z-index:20;left:5%;right:5%;top:8%;bottom:8%;border-radius:24px;background:rgba(8,14,21,.95);border:1px solid var(--accent);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 40px -10px var(--accent);color:white;padding:22px;display:none;overflow:auto;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(18px) scale(.98)}
#panel.open{display:block;animation:panelIn .38s cubic-bezier(.22,.9,.32,1.28) forwards}
#panel.closing{display:block;animation:panelOut .22s ease-in forwards}
@keyframes panelIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes panelOut{to{opacity:0;transform:translateY(14px) scale(.98)}}
#panel h2{margin:0 0 5px;font-size:25px;display:flex;align-items:center;gap:10px;color:var(--accent)}
#panel .sub{opacity:.7;margin-bottom:16px}
.task{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.12);font-size:16px;line-height:1.25;border-radius:10px;opacity:0;transform:translateX(-8px);animation:taskIn .35s ease forwards}
@keyframes taskIn{to{opacity:1;transform:translateX(0)}}
.task.done{color:rgba(255,255,255,.5)}
.task.done .label{text-decoration:line-through}
.task.flash-ok{animation:taskIn .35s ease forwards,rowFlash .55s ease}
@keyframes rowFlash{0%{background:rgba(255,255,255,0)}30%{background:color-mix(in srgb, var(--accent) 26%, transparent)}100%{background:rgba(255,255,255,0)}}
.checkwrap{flex:none;width:26px;height:26px;position:relative}
.task input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.checkmark{position:absolute;inset:0;border-radius:8px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.04);transition:border-color .2s,background .2s}
.checkmark svg{position:absolute;inset:0;width:100%;height:100%}
.checkmark path{fill:none;stroke:#0c1116;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease .05s}
.task input:checked ~ .checkmark{background:var(--accent);border-color:var(--accent)}
.task input:checked ~ .checkmark path{stroke-dashoffset:0}
.task input:focus-visible ~ .checkmark{outline:2px solid #fff;outline-offset:2px}
.progressRow{display:flex;align-items:center;gap:10px;margin:14px 0 6px;font-size:13px;color:rgba(255,255,255,.75)}
.progress{flex:1;height:9px;background:#26303a;border-radius:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fff0bd);transition:width .5s cubic-bezier(.22,.9,.32,1.2)}
.progressRow b{color:var(--accent);min-width:34px;text-align:right}
.panelFoot{margin-top:18px;text-align:right}
.resetBtn{background:none;border:0;color:rgba(255,255,255,.45);font-size:13px;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.close{position:absolute;right:14px;top:10px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:#121a22;color:white;font-size:22px}
#panelTitle{padding-right:45px}

/* Celebration */
.celebrate{animation:celebrate .5s ease}
@keyframes celebrate{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 40px 6px var(--accent)}100%{box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 40px -10px var(--accent)}}
.confetti{position:fixed;top:-3vh;border-radius:2px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion: reduce){
  .task{opacity:1;transform:none;animation:none}
  #panel.open,#panel.closing{animation:none;opacity:1;transform:none}
  .celebrate{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <section id="splash" class="screen active">
    <div class="stageWrap">
      <div class="stage">
        <img class="art" src="splash.webp" alt="" width="853" height="1844">
        <div class="wind" aria-hidden="true"></div>
        <button id="start" class="hotspot hint" aria-label="Начать"></button>
      </div>
    </div>
  </section>

  <section id="menu" class="screen">
    <div id="hud">
      <button id="backBtn" class="iconbtn" aria-label="Назад">‹</button>
      <div class="hudProgress" id="hudProgress">
        <div class="hudTop"><span>твой путь</span><b id="hudPct">0%</b></div>
        <div class="hudBarTrack"><i id="hudBar"></i></div>
      </div>
    </div>
    <div class="stageWrap">
      <div class="stage">
        <img class="art" src="menu.webp" alt="" width="864" height="1454">
        <div class="wind" aria-hidden="true"></div>
        <button id="health" class="hotspot hint" aria-label="Здоровье"></button>
        <button id="knowledge" class="hotspot hint" aria-label="Знания и навыки"></button>
        <button id="career" class="hotspot hint" aria-label="Карьера и финансы"></button>
        <button id="appearance" class="hotspot hint" aria-label="Внешность"></button>
      </div>
    </div>
  </section>

  <div id="panel">
    <button class="close rippler" id="close">×</button>
    <h2 id="panelTitle"></h2>
    <div class="sub" id="panelSub"></div>
    <div class="progressRow"><div class="progress"><i id="bar"></i></div><b id="barPct">0%</b></div>
    <div id="tasks"></div>
    <div class="panelFoot"><button class="resetBtn" id="resetBtn">Сбросить прогресс</button></div>
  </div>
  <div class="flash" id="flash"></div>
</div>
<script>
document.querySelectorAll('.screen').forEach(screen=>{
  const img=screen.querySelector('.art');
  if(img) screen.style.setProperty('--art-bg', `url(${img.src})`);
});

const RATIOS={splash:853/1844, menu:864/1454};
const appEl=document.getElementById('app');
function fitStage(name){
  const screen=document.getElementById(name);
  const stage=screen.querySelector('.stage');
  const cs=getComputedStyle(screen);
  // Always measure off #app (always has a real, definite size) rather than
  // off a flex child's clientHeight — a flex child sized by flex-grow can
  // report 0 before layout settles or when its own content is all
  // position:absolute (no intrinsic size), which collapsed the stage.
  let availW=appEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let availH=appEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(name==='menu'){
    const hud=document.getElementById('hud');
    if(hud) availH -= hud.offsetHeight;
  }
  const ar=RATIOS[name];
  let w,h;
  if(availW/availH > ar){ h=availH; w=h*ar; }
  else { w=availW; h=w/ar; }
  stage.style.width=w+'px';
  stage.style.height=h+'px';
}
function fitAll(){ try{ Object.keys(RATIOS).forEach(fitStage); }catch(e){} }
fitAll();
window.addEventListener('resize', fitAll);
window.addEventListener('orientationchange', ()=>setTimeout(fitAll,50));

// Wind motes
function makeWind(container,count){
  if(!container) return;
  for(let i=0;i<count;i++){
    const p=document.createElement('i');
    const size=(Math.random()*10+7).toFixed(1);
    const left=(Math.random()*100).toFixed(1);
    const dur=(Math.random()*7+9).toFixed(1);
    const delay=(-Math.random()*dur).toFixed(1);
    const drift=(Math.random()*80-40).toFixed(0);
    const op=(Math.random()*0.35+0.35).toFixed(2);
    p.style.cssText=`--size:${size}px;--left:${left}%;--dur:${dur}s;--delay:${delay}s;--drift:${drift}px;--op:${op}`;
    container.appendChild(p);
  }
}
try{
  makeWind(document.querySelector('#splash .wind'),12);
  makeWind(document.querySelector('#menu .wind'),9);
}catch(e){}

// ---------- sound + haptics ----------
let audioCtx;
function ctx(){ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(freq,dur,type,gainPeak,delay){
  try{
    const c=ctx(); const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(gainPeak||.06,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>tone(520,.09,'sine',.05),
  open:()=>{tone(420,.1,'sine',.05);tone(640,.12,'sine',.045,.06)},
  close:()=>{tone(500,.09,'sine',.045);tone(340,.11,'sine',.04,.05)},
  check:()=>{tone(660,.09,'sine',.06);tone(880,.12,'sine',.05,.07)},
  uncheck:()=>tone(360,.1,'sine',.045),
  start:()=>{tone(392,.1,'triangle',.05);tone(523,.1,'triangle',.045,.07);tone(659,.16,'triangle',.045,.14)},
  celebrate:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.05,i*.08))}
};
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

function addRipple(el,clientX,clientY){
  const r=el.getBoundingClientRect();
  const span=document.createElement('span');
  const size=Math.max(r.width,r.height)*1.2;
  span.className='ripple';
  span.style.width=span.style.height=size+'px';
  span.style.left=(clientX-r.left-size/2)+'px';
  span.style.top=(clientY-r.top-size/2)+'px';
  el.classList.add('rippler');
  el.appendChild(span);
  span.addEventListener('animationend',()=>span.remove());
}
// universal tap feedback: ripple+haptic fire fast on pointerdown, the
// real action fires on click (keeps keyboard/a11y activation intact)
function feel(el,e){
  buzz(8);
  const x = (e && e.clientX) || (el.getBoundingClientRect().left+el.getBoundingClientRect().width/2);
  const y = (e && e.clientY) || (el.getBoundingClientRect().top+el.getBoundingClientRect().height/2);
  addRipple(el,x,y);
}
function wireTap(el,soundFn){
  if(!el) return;
  el.addEventListener('pointerdown',(e)=>feel(el,e));
  if(soundFn) el.addEventListener('click',soundFn);
}

function transition(){
  const flash=document.getElementById('flash');
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
}

// ---------- screens ----------
const splash=document.getElementById('splash'),menu=document.getElementById('menu'),panel=document.getElementById('panel');
function goToMenu(){
  sfx.start(); buzz([10,30,14]); transition();
  splash.classList.remove('active');
  menu.classList.add('active');
  fitStage('menu');
  updateHud();
}
function goToSplash(){
  sfx.close(); buzz(10); transition();
  menu.classList.remove('active');
  splash.classList.add('active');
  fitStage('splash');
}
const startBtn=document.getElementById('start');
wireTap(startBtn);
startBtn.addEventListener('click',goToMenu);
const backBtn=document.getElementById('backBtn');
wireTap(backBtn);
backBtn.addEventListener('click',goToSplash);

// ---------- category data ----------
const data={
 health:{title:'ЗДОРОВЬЕ',sub:'Энергия для большого',icon:'❤',accent:'health',tasks:['Болит копчик','Зуб','Глаза','Плохая осанка и походка','Лысина','Изжога','Проблема с питанием','Астма']},
 knowledge:{title:'ЗНАНИЯ И НАВЫКИ',sub:'Развитие и уверенность',icon:'🧠',accent:'knowledge',tasks:['Не могу учиться, смотреть видео','Не могу долго учиться','Не могу определиться с выбором карьеры','Мало полезных навыков','Плохая память','Быстрое выгорание','Нет прогресса и побед','Проблема с языками']},
 career:{title:'КАРЬЕРА И ФИНАНСЫ',sub:'Стабильность и рост',icon:'💼',accent:'career',tasks:['Выучить чешский','Выучиться на IT-Helper','Научиться копить деньги','Не тратить так много на еду']},
 appearance:{title:'ВНЕШНОСТЬ',sub:'Уверенность в себе',icon:'🧍',accent:'appearance',tasks:['Убрать опухшие глаза','Убрать плохую походку и осанку','Убрать / зачесать лысину','Следить за гигиеной','Заниматься спортом']}
};
const CHECK_SVG='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function savedFor(key){ return JSON.parse(localStorage.getItem('mt_'+key)||'[]'); }
function countsFor(key){
  const saved=savedFor(key); const total=data[key].tasks.length;
  const done=saved.filter(Boolean).length;
  return {done,total};
}
function computeOverall(){
  let done=0,total=0;
  Object.keys(data).forEach(k=>{ const c=countsFor(k); done+=c.done; total+=c.total; });
  return total? Math.round(done/total*100):0;
}
let lastOverall=-1;
function updateHud(){
  const pct=computeOverall();
  document.getElementById('hudPct').textContent=pct+'%';
  document.getElementById('hudBar').style.width=pct+'%';
  if(lastOverall>=0 && pct>lastOverall){
    const hp=document.getElementById('hudProgress');
    hp.classList.remove('bump'); void hp.offsetWidth; hp.classList.add('bump');
    if(pct===100) celebrateBig();
  }
  lastOverall=pct;
}

let currentKey=null;
const title=document.getElementById('panelTitle'),sub=document.getElementById('panelSub'),
      tasksEl=document.getElementById('tasks'),bar=document.getElementById('bar'),barPct=document.getElementById('barPct');

function closePanel(){
  sfx.close(); buzz(10);
  panel.classList.remove('open'); panel.classList.add('closing');
  panel.addEventListener('animationend',function h(){ panel.classList.remove('closing'); panel.removeEventListener('animationend',h); },{once:true});
}
wireTap(document.getElementById('close'));
document.getElementById('close').addEventListener('click',closePanel);

function paintBar(key){
  const {done,total}=countsFor(key);
  const pct= total? Math.round(done/total*100):0;
  bar.style.width=pct+'%';
  barPct.textContent=pct+'%';
  return pct;
}

function openCat(key){
  sfx.open(); buzz(12);
  currentKey=key;
  const d=data[key];
  document.documentElement.style.setProperty('--accent',`var(--ok-${d.accent})`);
  document.documentElement.style.setProperty('--accent-dim',`var(--ok-${d.accent}-dim)`);
  title.innerHTML=`<span aria-hidden="true">${d.icon}</span> ${d.title}`;
  sub.textContent=d.sub;
  const saved=savedFor(key);
  tasksEl.innerHTML='';
  d.tasks.forEach((t,i)=>{
    const row=document.createElement('label');
    row.className='task'+(saved[i]?' done':'');
    row.style.animationDelay=(i*0.045)+'s';
    const wrap=document.createElement('span'); wrap.className='checkwrap';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!saved[i];
    const mark=document.createElement('span'); mark.className='checkmark'; mark.innerHTML=CHECK_SVG;
    wrap.append(cb,mark);
    const label=document.createElement('span'); label.className='label'; label.textContent=t;
    row.append(wrap,label);
    row.addEventListener('pointerdown',(e)=>feel(row,e));
    cb.addEventListener('change',()=>{
      saved[i]=cb.checked;
      localStorage.setItem('mt_'+key,JSON.stringify(saved));
      row.classList.toggle('done',cb.checked);
      if(cb.checked){ sfx.check(); buzz(14); row.classList.remove('flash-ok'); void row.offsetWidth; row.classList.add('flash-ok'); }
      else { sfx.uncheck(); buzz(8); }
      const pct=paintBar(key);
      if(pct===100 && cb.checked) celebrateCat();
      updateHud();
    });
    tasksEl.appendChild(row);
  });
  paintBar(key);
  panel.classList.remove('closing');
  panel.classList.add('open');
}
['health','knowledge','career','appearance'].forEach(key=>{
  const el=document.getElementById(key);
  if(!el) return;
  wireTap(el);
  el.addEventListener('click',()=>openCat(key));
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!currentKey) return;
  if(!confirm('Сбросить прогресс в этой категории?')) return;
  localStorage.removeItem('mt_'+currentKey);
  sfx.uncheck(); buzz(10);
  openCat(currentKey);
  updateHud();
});

// ---------- celebrations ----------
function confettiBurst(n){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#f2b95f','#ff5a5a','#3fd0ff','#3ddc97','#fff0bd'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='confetti';
    const size=(Math.random()*6+5);
    p.style.width=size+'px'; p.style.height=(size*1.4)+'px';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[i%colors.length];
    const dur=(Math.random()*1.4+1.6).toFixed(2);
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(Math.random()*0.25)+'s';
    document.getElementById('app').appendChild(p);
    p.addEventListener('animationend',()=>p.remove());
  }
}
function celebrateCat(){
  panel.classList.remove('celebrate'); void panel.offsetWidth; panel.classList.add('celebrate');
  sfx.celebrate(); buzz([12,40,12,40,20]);
  confettiBurst(26);
}
function celebrateBig(){
  sfx.celebrate(); buzz([16,50,16,50,16,50,30]);
  confettiBurst(60);
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// subtle pointer parallax — desktop / mouse only, never on touch,
// so on-screen hotspot alignment stays pixel-exact on phones
if(window.matchMedia('(pointer: fine)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelectorAll('.stage').forEach(stage=>{
    stage.addEventListener('mousemove',(e)=>{
      const r=stage.getBoundingClientRect();
      const dx=((e.clientX-r.left)/r.width-0.5)*8;
      const dy=((e.clientY-r.top)/r.height-0.5)*8;
      stage.style.transform=`translate(${-dx}px,${-dy}px)`;
    });
    stage.addEventListener('mouseleave',()=>{ stage.style.transform=''; });
  });
}

// remove the first-visit hint glow once the user has interacted once
document.addEventListener('pointerdown',function once(){
  document.querySelectorAll('.hint').forEach(el=>el.classList.remove('hint'));
  document.removeEventListener('pointerdown',once);
},{once:true});

updateHud();
</script>
